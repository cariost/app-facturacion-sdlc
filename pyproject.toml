[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "specforge"
version = "0.1.0"
description = "SpecForge — Stateful Spec-Driven Agentic SDLC Engine para un ERP modular agnóstico al giro (SUNAT/SIRE + CRM configurable)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4,<3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.32,<2.1",
    "psycopg[binary,pool]>=3.2,<4",
    "pgvector>=0.3.2",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]
llm = ["anthropic>=2.12,<3"]
observability = ["opentelemetry-api>=1.27"]

[project.scripts]
specforge-db = "specforge.db.migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["src/specforge"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "PT", "TC", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "specforge.schemas.common.Contract",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "TC"]
# FastAPI resuelve las anotaciones de las rutas en tiempo de ejecución.
"src/specforge/api/app.py" = ["TC001", "TC002", "TC003"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["specforge"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: requiere PostgreSQL con pgvector (SPECFORGE_TEST_DATABASE_URL)",
    "e2e: ciclo de vida completo de una feature (API + orquestador + BD)",
]
